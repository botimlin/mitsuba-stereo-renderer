name: "Question / Help"
description: Usage questions, environment setup, integration with your training pipeline.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Welcome! Before opening, please skim the README — it covers most setup,
        coordinate-system, and CLI questions.

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: The goal, not just the symptom. Include what you've already tried.
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: Mitsuba variant, Blender version, GPU, OS — whatever's relevant.
      placeholder: "Mitsuba 3.5.2 cuda_ad_rgb, Blender 4.2.1, RTX 3060, Windows 11"

  - type: textarea
    id: command
    attributes:
      label: Command(s) you ran (if any)
      render: bash
